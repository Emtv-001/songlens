<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My account — SongLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/forms.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">Song<span>Lens</span></a>
    </header>

    <main>
      <div class="card" id="account-card">
        <h1>My account</h1>
        <p class="account-line" id="loading">Loading…</p>
        <p class="account-line" id="account-username" hidden></p>
        <p class="account-line" id="account-email" hidden></p>
        <p class="form-message" id="form-message" role="alert"></p>
        <button class="btn" id="logout-btn" type="button" hidden>Log out</button>
      </div>
    </main>

    <footer class="site-footer">© 2026 EMTV TECH. All rights reserved.</footer>
    <script src="/js/auth.js"></script>
      <script src="/js/page-nav.js"></script>
  </body>
