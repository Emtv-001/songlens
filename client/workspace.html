<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace — SongLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/songs.css" />
    <link rel="stylesheet" href="/css/player.css" />
    <link rel="stylesheet" href="/css/workspace.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="/" class="brand">Song<span>Lens</span></a>
      <nav class="nav">
        <a href="/songs.html">Library</a>
        <a href="/library.html">My library</a>
        <a href="/upload.html">Upload</a>
        <a href="/account.html">Account</a>
      </nav>
    </header>

    <main>
      <p class="status-text" id="status" role="status">Loading…</p>

      <section class="player-card" id="workspace" hidden>
        <h1 id="song-title"></h1>
        <p class="artist" id="song-artist"></p>

        <audio id="audio" controls preload="metadata"></audio>

        <div class="speed-row">
          <label for="speed">Speed</label>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>

        <div class="now-panel">
          <div class="now-box">
            <p class="label">Time</p>
            <p class="value" id="now-time">0:00.0</p>
          </div>
          <div class="now-box">
            <p class="label">Chord</p>
            <p class="value chord" id="now-chord">—</p>
          </div>
        </div>

        <h2 class="section-title">Chords</h2>
        <div class="chord-strip" id="chord-strip" tabindex="0" aria-label="Chord timeline"></div>

        <h2 class="section-title">Lyrics</h2>
        <div class="lyrics-box" id="lyrics-box"></div>

        <p class="hint" id="timeline-hint" hidden>
          This song has no chords or lyrics yet. The editor for adding them comes in a later step.
        </p>
      </section>
    </main>

    <footer class="site-footer">© 2026 EMTV TECH. All rights reserved.</footer>
    <script src="/js/clock.js"></script>
    <script src="/js/timeline-utils.js"></script>
    <script src="/js/views/chord-view.js"></script>
    <script src="/js/views/lyrics-view.js"></script>
    <script src="/js/workspace.js"></script>
  </body>
</html>
